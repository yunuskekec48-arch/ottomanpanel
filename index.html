<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Osmanlı Pro Asistan</title>
    <style>
        :root { --gold: #d4af37; --red: #c0392b; --bg: #0d0d0d; --card: rgba(20, 20, 20, 0.95); --blue: #2980b9; --purple: #8e44ad; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            transition: background 0.8s ease-in-out;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            overflow-x: hidden;
        }

        #bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 0;
            display: none;
        }

        .screen { display: none; min-height: 100vh; padding: 20px; box-sizing: border-box; flex-direction: column; position: relative; z-index: 1; }
        .active { display: flex; }

        /* BANNER BOYUTUNU DEV YAPAN KISIM */
        .banner-list { overflow-y: auto; flex: 1; padding: 10px; }
        .banner-item { 
            height: 300px; /* Yüksekliği 300px yaparak şerit görüntüsünü yok ettik */
            width: 100%;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex; 
            align-items: flex-end; 
            padding: 30px; 
            background-size: cover; 
            background-position: center center; 
            background-repeat: no-repeat;
            font-size: 32px; /* Yazıyı daha görkemli yaptık */
            font-weight: bold; 
            text-shadow: 4px 4px 12px #000;
            border: 3px solid #333;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            cursor: pointer;
            box-sizing: border-box;
            background-color: #1a1a1a;
        }
        
        .banner-item:hover { border-color: var(--gold); transform: translateY(-8px); }
        .banner-item:active { transform: scale(0.96); }

        .variant-tag { font-size: 14px; color: var(--gold); border: 2px solid var(--gold); padding: 4px 10px; margin-left: 20px; border-radius: 6px; background: rgba(0,0,0,0.85); margin-bottom: 8px; letter-spacing: 1px;}

        h1 { font-size: 30px; color: var(--gold); text-align: center; margin: 20px 0 30px 0; text-transform: uppercase; letter-spacing: 3px; font-weight: 900; }
        
        /* Spinner ve Buton Tasarımları */
        .spinner-box { background: var(--card); padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #444; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .spinner-row { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; }
        .spin-btns { display: flex; align-items: center; gap: 15px; }
        .spin-btn { width: 60px; height: 60px; background: #222; border: 2px solid #555; color: white; border-radius: 15px; font-size: 30px; cursor: pointer; }
        .quick-btn { width: 60px; height: 60px; background: var(--gold); color: black; border: none; border-radius: 15px; font-weight: 900; font-size: 22px; cursor: pointer; }
        .val { width: 50px; text-align: center; font-size: 30px; font-weight: bold; color: var(--gold); }

        .btn-large { width: 100%; padding: 28px; border-radius: 20px; border: none; font-weight: 900; font-size: 24px; margin-bottom: 20px; color: white; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: black; }
        .btn-red { background: var(--red); }
        
        .back-link { color: #fff; text-decoration: none; font-size: 20px; margin-bottom: 25px; display: inline-block; background: rgba(255,255,255,0.2); padding: 12px 30px; border-radius: 40px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>

    <div id="screen1" class="screen active">
        <h1>RAKİP SEÇ</h1>
        <div class="banner-list" id="bannerContainer"></div>
    </div>

    <div id="screen2" class="screen">
        <a href="#" class="back-link" onclick="resetApp()">← DEĞİŞTİR</a>
        <h1>1 - 1 - 3 - 1</h1>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="spinner-box">💰<br><span>1</span><br><small>ALTIN</small></div>
            <div class="spinner-box">🪨<br><span>1</span><br><small>TAŞ</small></div>
            <div class="spinner-box">🪵<br><span>3</span><br><small>ODUN</small></div>
            <div class="spinner-box">🍖<br><span>1</span><br><small>YEMEK</small></div>
        </div>
        <button class="btn-large btn-gold" style="margin-top:auto" onclick="showScreen(3)">SCOUT BAŞLADI</button>
    </div>

    <div id="screen3" class="screen">
        <a href="#" class="back-link" onclick="showScreen(2)">← GERİ</a>
        <h1>GÖZCÜ PANELİ</h1>
        <div id="spinners"></div>
        <button class="btn-large btn-gold" style="margin-top:auto" onclick="showScreen(1)">ANALİZ ET</button>
    </div>

<script>
    // FOTOĞRAFLARINLA (Screenshot 4) %100 UYUMLU LİSTE
    const civList = [
        {id: "abbasid", name: "Abbasid Dynasty"}, 
        {id: "ayyubid", name: "Ayyubids", variant: true},
        {id: "byzantine", name: "Byzantines"}, 
        {id: "macedoniandynasty", name: "Macedonian Dynasty", variant: true},
        {id: "chinese", name: "Chinese"}, 
        {id: "zhuxislegacy", name: "Zhu Xi's Legacy", variant: true},
        {id: "delhi", name: "Delhi Sultanate"}, 
        {id: "tughlaqdynasty", name: "Tughlaq Dynasty", variant: true},
        {id: "english", name: "English"}, 
        {id: "houseoflancaster", name: "House of Lancaster", variant: true},
        {id: "french", name: "French"}, 
        {id: "jeannedarc", name: "Jeanne d'Arc", variant: true},
        {id: "holyromanempire", name: "Holy Roman Empire"}, 
        {id: "orderofthedragon", name: "Order of the Dragon", variant: true},
        {id: "knightstemplar", name: "Knights Templar", variant: true}, 
        {id: "japanese", name: "Japanese"},
        {id: "sengokudaimyo", name: "Sengoku Daimyo", variant: true}, 
        {id: "malians", name: "Malians"},
        {id: "mongols", name: "Mongols"}, 
        {id: "goldenhorde", name: "Golden Horde", variant: true},
        {id: "ottomans", name: "Ottomans"}, 
        {id: "rus", name: "Rus"}
    ];

    const bannerContainer = document.getElementById('bannerContainer');
    
    civList.forEach(civ => {
        const div = document.createElement('div');
        div.className = 'banner-item';
        
        // Dosya isimleri Screenshot 4 ile eşleşiyor
        const imgPath = `banners/${civ.id}.png`; 
        
        div.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.65)), url('${imgPath}')`;
        div.innerHTML = `<div>${civ.name.toUpperCase()} ${civ.variant ? '<span class="variant-tag">VARYANT</span>' : ''}</div>`;
        
        div.onclick = () => { 
            document.body.style.backgroundImage = `url('${imgPath}')`;
            document.getElementById('bg-overlay').style.display = 'block';
            showScreen(2); 
        };
        bannerContainer.appendChild(div);
    });

    function showScreen(n) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('screen' + n);
        if(target) target.classList.add('active');
    }

    function resetApp() {
        document.body.style.backgroundImage = "none";
        document.getElementById('bg-overlay').style.display = 'none';
        showScreen(1);
    }
</script>
</body>
</html>
